<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ポケモン全国図鑑＆プレミアボール管理</title>
　<link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1e293b" />
　<link rel="icon" type="image/png" href="./icon.png" />
　<link rel="apple-touch-icon" href="./icon.png" />
  <style>
    :root {
      --bg-color: #f4f6f8;
      --header-bg: #1e293b;
      --header-text: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --caught-normal-bg: #dcfce7;
      --caught-normal-border: #4ade80;
      --caught-shiny-bg: #fef3c7;
      --caught-shiny-border: #fbbf24;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-normal: #10b981;
      --accent-shiny: #f59e0b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-top: 175px; /* ヘッダーの高さ分 */
      padding-bottom: 40px;
    }

    /* 固定ヘッダー */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: var(--header-bg);
      color: var(--header-text);
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      padding: 10px 12px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .backup-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ページ切替タブ（将来の別図鑑追加用） */
    .page-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 8px;
      padding-bottom: 2px;
    }

    .page-tab {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .page-tab.active {
      background: #3b82f6;
      color: #ffffff;
    }

    /* 通常色 / 色違い 切替＆カウンター */
    .mode-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .mode-switch {
      display: flex;
      background: #0f172a;
      border-radius: 8px;
      padding: 3px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active[data-mode="normal"] {
      background: var(--accent-normal);
      color: #fff;
    }

    .mode-btn.active[data-mode="shiny"] {
      background: var(--accent-shiny);
      color: #fff;
    }

    .stats-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
    }

    .stat-label {
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 400;
    }

    /* 検索・フィルター */
    .filter-bar {
      display: flex;
      gap: 6px;
    }

    .search-input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      outline: none;
    }

    .filter-select {
      padding: 6px 8px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      background: #fff;
      color: var(--text-main);
      font-weight: 600;
    }

    /* リストコンテナ */
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 8px 12px;
    }

    .pokemon-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ポケモンタイル（1行） */
    .poke-tile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.12s, border-color 0.12s, transform 0.05s;
    }

    .poke-tile:active {
      transform: scale(0.99);
    }

    /* 所持済の色変化（通常色モード） */
    body[data-mode="normal"] .poke-tile.caught {
      background-color: var(--caught-normal-bg);
      border-color: var(--caught-normal-border);
    }

    /* 所持済の色変化（色違いモード） */
    body[data-mode="shiny"] .poke-tile.caught {
      background-color: var(--caught-shiny-bg);
      border-color: var(--caught-shiny-border);
    }

    .poke-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .poke-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 42px;
    }

    .poke-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poke-form {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* プレミアボールボタン */
    .ball-btn {
      background: none;
      border: none;
      padding: 6px;
      margin: -6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .ball-btn:active {
      background: rgba(0, 0, 0, 0.08);
    }

    .ball-icon {
      width: 28px;
      height: 28px;
      transition: transform 0.15s;
    }

    .ball-btn.premier .ball-icon {
      transform: scale(1.08);
    }

    /* モーダル（データバックアップ用） */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }

    .modal-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 10px 0;
    }

    .backup-textarea {
      width: 100%;
      height: 120px;
      font-size: 11px;
      font-family: monospace;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body data-mode="normal">

  <header>
    <div class="header-top">
      <h1 class="app-title">Pokémon HOME 図鑑管理</h1>
      <button class="backup-btn" onclick="openBackupModal()">データ引継ぎ</button>
    </div>

    <div class="page-tabs" id="pageTabs">
      <button class="page-tab active" data-dex="national" onclick="switchDex('national')">全国図鑑</button>
      <button class="page-tab" data-dex="unown" onclick="switchDex('unown')">アンノーン図鑑</button>
      <button class="page-tab" data-dex="vivillon" onclick="switchDex('vivillon')">ビビヨン図鑑</button>
      <button class="page-tab" data-dex="alcremie" onclick="switchDex('alcremie')">マホイップ図鑑</button>
    </div>

    <div class="mode-bar">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="normal" onclick="switchMode('normal')">通常色</button>
        <button class="mode-btn" data-mode="shiny" onclick="switchMode('shiny')">色違い</button>
      </div>

      <div class="stats-box">
        <div class="stat-item">
          <span class="stat-label">所持:</span>
          <span id="caughtCount">0</span>/<span id="totalCount">0</span>
        </div>
        <div class="stat-item" style="color: #fca5a5;">
          <span class="stat-label">プレボ:</span>
          <span id="premierCount">0</span>
        </div>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="名前・No検索..." oninput="renderList()" />
      <select id="regionSelect" class="filter-select" onchange="renderList()">
        <option value="all">全地方</option>
        <option value="kanto">カントー</option>
        <option value="johto">ジョウト</option>
        <option value="hoenn">ホウエン</option>
        <option value="sinnoh">シンオウ</option>
        <option value="unova">イッシュ</option>
        <option value="kalos">カロス</option>
        <option value="alola">アローラ</option>
        <option value="galar">ガラル・ヒスイ</option>
        <option value="paldea">パルデア</option>
      </select>
      <select id="filterSelect" class="filter-select" onchange="renderList()">
        <option value="all">すべて</option>
        <option value="uncaught">未所持のみ</option>
        <option value="unpremier">プレボ未捕獲</option>
        <option value="premier">プレボ済のみ</option>
      </select>
    </div>
  </header>

  <main class="container">
    <div class="pokemon-list" id="pokemonList"></div>
  </main>

  <!-- バックアップモーダル -->
  <div class="modal-overlay" id="backupModal">
    <div class="modal-box">
      <h2 class="modal-title">データのバックアップ・復元</h2>
      <p class="modal-desc">機種変更時は下のテキストをコピーして保存し、新しい端末で貼り付けて「復元」を押してください。</p>
      <textarea id="backupText" class="backup-textarea"></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeBackupModal()">閉じる</button>
        <button class="btn-secondary" onclick="copyBackup()">コピー</button>
        <button class="btn-primary" onclick="restoreBackup()">貼り付けたデータで復元</button>
      </div>
    </div>
  </div>

    // ==========================================
    // 2. 状態管理（localStorageに自動保存）
    // ==========================================
    const STORAGE_KEY = "poke_home_premier_dex_v1";
    let currentDex = "national";
    let currentMode = "normal"; // "normal" or "shiny"

    // 保存データ構造: { normal: { [id]: { caught: bool, premier: bool } }, shiny: { [id]: { caught: bool, premier: bool } } }
    let saveData = loadSaveData();

    function loadSaveData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            normal: parsed.normal || {},
            shiny: parsed.shiny || {}
          };
        }
      } catch (e) {
        console.error("Load error", e);
      }
      return { normal: {}, shiny: {} };
    }

    function persistSaveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
    }

    // ==========================================
    // 3. ボールアイコンSVG生成（未チェック時はグレー、チェック時はプレミアボール配色）
    // ==========================================
    function getBallSVG(isPremier) {
      if (!isPremier) {
        // 未捕獲（グレーアウトしたモンスターボール）
        return `
          <svg class="ball-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
            <path d="M3 18H33" stroke="#94a3b8" stroke-width="2.5"/>
            <circle cx="18" cy="18" r="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
          </svg>
        `;
      } else {
        // プレミアボール（白ベース＋赤い中央ライン）
        return `
          <svg class="ball-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="18" cy="18" r="15" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
            <path d="M3.5 18H32.5" stroke="#ef4444" stroke-width="3.5"/>
            <circle cx="18" cy="18" r="5.5" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
            <circle cx="18" cy="18" r="2" fill="#ef4444"/>
          </svg>
        `;
      }
    }

    // ==========================================
    // 4. タップ操作・画面描画
    // ==========================================
    function toggleCaught(id) {
      const modeStore = saveData[currentMode];
      const current = modeStore[id] || { caught: false, premier: false };
      const nextCaught = !current.caught;

      // 所持をOFFにした場合は、プレミアボールもOFFにする
      modeStore[id] = {
        caught: nextCaught,
        premier: nextCaught ? current.premier : false
      };

      persistSaveData();
      renderList();
    }

    function togglePremier(event, id) {
      event.stopPropagation(); // タイルのクリックイベント発火を防ぐ
      const modeStore = saveData[currentMode];
      const current = modeStore[id] || { caught: false, premier: false };
      const nextPremier = !current.premier;

      // 連動動作ON: プレミアボールをONにしたら、所持も自動でONにする
      modeStore[id] = {
        caught: nextPremier ? true : current.caught,
        premier: nextPremier
      };

      persistSaveData();
      renderList();
    }

    function switchMode(mode) {
      currentMode = mode;
      document.body.setAttribute("data-mode", mode);
      document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-mode") === mode);
      });
      renderList();
    }

    function switchDex(dexKey) {
      currentDex = dexKey;
      document.querySelectorAll(".page-tab").forEach(tab => {
        tab.classList.toggle("active", tab.getAttribute("data-dex") === dexKey);
      });
      // 全国図鑑のときだけ地方フィルターを表示する
      const regionSelect = document.getElementById("regionSelect");
      if (regionSelect) {
        regionSelect.style.display = (dexKey === "national") ? "block" : "none";
      }
      renderList();
    }

    // 図鑑番号から地方を判定する関数
    function matchRegion(pokeNo, region) {
      if (currentDex !== "national" || region === "all") return true;
      const num = parseInt(pokeNo, 10);
      if (region === "kanto") return num >= 1 && num <= 151;
      if (region === "johto") return num >= 152 && num <= 251;
      if (region === "hoenn") return num >= 252 && num <= 386;
      if (region === "sinnoh") return num >= 387 && num <= 493;
      if (region === "unova") return num >= 494 && num <= 649;
      if (region === "kalos") return num >= 650 && num <= 721;
      if (region === "alola") return num >= 722 && num <= 809;
      if (region === "galar") return num >= 810 && num <= 905;
      if (region === "paldea") return num >= 906 && num <= 1025;
      return true;
    }

    function updateStats() {
      const list = DEX_DATA[currentDex] || [];
      const modeStore = saveData[currentMode];
      const region = document.getElementById("regionSelect") ? document.getElementById("regionSelect").value : "all";
      
      let total = 0;
      let caught = 0;
      let premier = 0;

      list.forEach(p => {
        if (!matchRegion(p.no, region)) return;
        total++;
        const st = modeStore[p.id];
        if (st?.caught) caught++;
        if (st?.premier) premier++;
      });

      document.getElementById("totalCount").textContent = total;
      document.getElementById("caughtCount").textContent = caught;
      document.getElementById("premierCount").textContent = premier;
    }

    function renderList() {
      const listContainer = document.getElementById("pokemonList");
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const filterType = document.getElementById("filterSelect").value;
      const region = document.getElementById("regionSelect") ? document.getElementById("regionSelect").value : "all";
      const list = DEX_DATA[currentDex] || [];
      const modeStore = saveData[currentMode];

      updateStats();

      const fragment = document.createDocumentFragment();

      list.forEach(poke => {
        // 地方フィルタ
        if (!matchRegion(poke.no, region)) return;

        const st = modeStore[poke.id] || { caught: false, premier: false };

        // 検索フィルタ
        if (keyword) {
          const matchName = poke.name.toLowerCase().includes(keyword);
          const matchNo = poke.no.includes(keyword);
          const matchForm = (poke.form || "").toLowerCase().includes(keyword);
          if (!matchName && !matchNo && !matchForm) return;
        }

        // 状態フィルタ
        if (filterType === "uncaught" && st.caught) return;
        if (filterType === "unpremier" && st.premier) return;
        if (filterType === "premier" && !st.premier) return;

        const tile = document.createElement("div");
        tile.className = "poke-tile" + (st.caught ? " caught" : "");
        tile.onclick = () => toggleCaught(poke.id);

        const formHtml = poke.form ? `<span class="poke-form">${poke.form}</span>` : "";

        tile.innerHTML = `
          <div class="poke-info">
            <span class="poke-num">No.${poke.no}</span>
            <span class="poke-name">${poke.name}</span>
            ${formHtml}
          </div>
          <button class="ball-btn ${st.premier ? "premier" : ""}" aria-label="プレミアボール切替" onclick="togglePremier(event, '${poke.id}')">
            ${getBallSVG(st.premier)}
          </button>
        `;

        fragment.appendChild(tile);
      });

      listContainer.innerHTML = "";
      listContainer.appendChild(fragment);
    }

    // ==========================================
    // 5. バックアップ・復元機能
    // ==========================================
    function openBackupModal() {
      document.getElementById("backupText").value = JSON.stringify(saveData);
      document.getElementById("backupModal").classList.add("open");
    }

    function closeBackupModal() {
      document.getElementById("backupModal").classList.remove("open");
    }

    function copyBackup() {
      const textarea = document.getElementById("backupText");
      textarea.select();
      document.execCommand("copy");
      alert("バックアップデータをコピーしました！");
    }

    function restoreBackup() {
      try {
        const raw = document.getElementById("backupText").value.trim();
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.normal && parsed.shiny) {
          saveData = parsed;
          persistSaveData();
          renderList();
          closeBackupModal();
          alert("データを復元しました！");
        } else {
          alert("データの形式が正しくありません。");
        }
      } catch (e) {
        alert("データの読み込みに失敗しました。文字列が欠けていないか確認してください。");
      }
    }

    // 初期描画
    renderList();
  </script>
　<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
